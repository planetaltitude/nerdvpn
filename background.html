<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NerdVPN Redirect Controls</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 16px;
      max-width: 640px;
      line-height: 1.5;
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }

    .card {
      border: 1px solid color-mix(in srgb, currentColor 15%, transparent);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 6px color-mix(in srgb, currentColor 10%, transparent);
      background: color-mix(in srgb, currentColor 2%, transparent);
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
    }

    .toggle label {
      display: flex;
      gap: 8px;
      align-items: center;
      cursor: pointer;
      font-weight: 600;
    }

    .description {
      font-size: 0.95rem;
      margin: 8px 0 16px;
    }

    .note {
      font-size: 0.9rem;
      color: color-mix(in srgb, currentColor 70%, transparent);
      margin-top: 12px;
    }

    form {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    input[type="text"] {
      flex: 1;
      min-width: 220px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
      background: color-mix(in srgb, currentColor 3%, transparent);
    }

    button {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid color-mix(in srgb, currentColor 15%, transparent);
      background: color-mix(in srgb, currentColor 6%, transparent);
      cursor: pointer;
      font-weight: 600;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #status {
      margin-top: 12px;
      font-weight: 600;
    }

    #status.error {
      color: #b00020;
    }

    #status.success {
      color: #0b8457;
    }

    .site-list {
      margin: 12px 0 0;
      padding: 0;
      list-style: disc;
      padding-left: 20px;
      display: grid;
      gap: 6px;
    }

    .site-list-title {
      font-weight: 700;
      margin: 16px 0 6px;
    }

    .empty-text {
      margin: 8px 0 0;
      font-size: 0.95rem;
      color: color-mix(in srgb, currentColor 65%, transparent);
    }
  </style>
</head>
<body>
  <h1>NerdVPN redirect controls</h1>
  <div class="card">
    <p class="description">Making the web calm and usable again.</p>
    <div class="toggle">
      <input type="checkbox" id="toggle-x" />
      <label for="toggle-x">Redirect X (x.com → xcancel.com)</label>
    </div>
    <div class="toggle">
      <input type="checkbox" id="toggle-reddit" />
      <label for="toggle-reddit">Redirect Reddit (reddit.com → reddit.nerdvpn.de)</label>
    </div>
    <div class="toggle">
      <input type="checkbox" id="toggle-archive" />
      <label for="toggle-archive">Redirect paywalled news to archive.is</label>
    </div>
    <form id="add-paywall-form">
      <label for="paywall-host" class="sr-only">Add paywalled site</label>
      <input
        type="text"
        id="paywall-host"
        name="paywall-host"
        placeholder="Add a paywalled site (e.g., latimes.com)"
        autocomplete="off"
      />
      <button type="submit">Add</button>
    </form>
    <p class="note">Changes apply immediately and persist between browser restarts.</p>
    <p class="site-list-title">Default paywalled sites</p>
    <ul id="default-paywall-sites" class="site-list" aria-live="polite"></ul>
    <p class="site-list-title">Your added sites</p>
    <ul id="custom-paywall-sites" class="site-list" aria-live="polite"></ul>
    <p id="custom-paywall-empty" class="empty-text" aria-live="polite">No additional sites added yet.</p>
    <div id="status" role="status" aria-live="polite"></div>
  </div>
  <script src="background.js"></script>
</body>
</html>
